<style>
/* Layout concept: a drafting sheet. Thin ruled lines, title-block cards, mono annotations,
   one hi-vis orange. The hero is a sticky 3D scene scrubbed by scroll. */
:root{
  --bg:#EDEFEB; --surface:#F6F7F4; --raise:#FFFFFF; --fg:#15191B; --muted:#586163;
  --line:#CBD0CA; --line-strong:#98A19C; --accent:#E86A17; --accent-text:#AE4C08;
  --on-accent:#14181A; --blue:#27506E; --ground:#DFE3DC; --night:#15191B; --on-night:#ECEEE9;
  --font-d:"Big Shoulders Display","Noto Sans Sinhala",Impact,sans-serif;
  --font-b:"IBM Plex Sans","Noto Sans Sinhala",system-ui,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --hh:64px; color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--font-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block}
a{color:inherit}
h1,h2,h3,h4,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:max(16px,4vw)}
.display{font-family:var(--font-d);font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.95;text-wrap:balance}
:lang(si) .display{font-family:"Noto Sans Sinhala",var(--font-b);font-weight:700;text-transform:none;line-height:1.25;letter-spacing:0}
.mono{font-family:var(--font-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
:lang(si) .mono{letter-spacing:.02em}
.accent-text{color:var(--accent-text)}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.6rem;min-height:44px;padding:.6rem 1.15rem;font-weight:600;font-size:14px;text-decoration:none;border:1.5px solid var(--fg);background:transparent;transition:background .15s,color .15s,transform .15s}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ghost{border-color:var(--line-strong)}
.btn svg{width:16px;height:16px;flex:none}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#top .row{height:var(--hh);display:flex;align-items:center;gap:1.2rem}
.logo{display:flex;align-items:center;text-decoration:none;color:var(--fg);flex:none}

nav.main{display:flex;gap:.2rem;margin-left:auto;align-items:center}
nav.main a{padding:.5rem .65rem;font-size:13.5px;font-weight:500;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.main a:hover{color:var(--fg)}
nav.main a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.lang{display:flex;border:1.5px solid var(--line-strong);flex:none}
.lang button{padding:.3rem .65rem;font-size:12.5px;font-weight:600;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.burger{display:none;width:44px;height:44px;align-items:center;justify-content:center;border:1.5px solid var(--line-strong)}
.burger svg{width:20px;height:20px}
.drawer{display:none;border-top:1px solid var(--line);background:var(--bg)}
.drawer a{display:block;padding:.85rem 0;font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}
.drawer a[aria-current="page"]{color:var(--accent-text)}
@media (max-width:1120px){
  nav.main{display:none}.burger{display:flex;margin-left:auto}
  .lang{margin-left:0}
  #top.open .drawer{display:block}
}
@media (max-width:420px){#top .row{gap:.6rem}}

/* hero */
#hero{position:relative;height:560vh;height:560svh;background:var(--bg)}
#hero .sticky{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));height:calc(100vh - var(--hh));height:calc(100svh - var(--hh));overflow:hidden}
#hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hero .grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;mask-image:radial-gradient(ellipse at 65% 55%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 65% 55%,#000 0,transparent 70%);pointer-events:none}
#hero .fallback{position:absolute;inset:8% 6%;display:none;color:var(--line-strong)}
#hero .fallback svg{width:100%;height:100%}
.hero-copy{position:absolute;left:0;right:0;top:clamp(20px,6vh,64px);pointer-events:none}
.hero-copy .in{max-width:620px;display:grid;gap:1.1rem}
.hero-copy h1{font-size:clamp(3rem,8.4vw,7.2rem)}
:lang(si) .hero-copy h1{font-size:clamp(2.1rem,5.6vw,4.4rem)}
.hero-copy .sub{font-size:clamp(15px,1.5vw,18px);color:var(--muted);max-width:46ch}
.hero-copy .acts{display:flex;gap:.7rem;flex-wrap:wrap;pointer-events:auto}
.hero-copy .kick{display:flex;align-items:center;gap:.6rem;color:var(--accent-text)}
.hero-copy .kick i{display:block;width:34px;height:2px;background:var(--accent)}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);pointer-events:none;text-align:center;white-space:nowrap}
.hint i{width:1.5px;height:30px;background:linear-gradient(var(--accent),transparent);animation:drip 1.6s infinite}
@keyframes drip{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(.2);transform-origin:bottom}}
.stage{position:absolute;left:max(16px,4vw);bottom:18px;width:min(380px,calc(100% - 32px));background:color-mix(in srgb,var(--surface) 92%,transparent);border:1.5px solid var(--fg);opacity:0;transition:opacity .3s}
.stage .top{display:flex;justify-content:space-between;padding:.55rem .8rem;border-bottom:1px solid var(--line-strong);color:var(--muted)}
.stage .body{padding:.8rem .9rem 1rem;display:grid;gap:.35rem}
.stage h2{font-size:2rem}
:lang(si) .stage h2{font-size:1.35rem}
.stage p{font-size:14px;color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:0 .9rem .9rem}
.rail i{display:block;height:5px;background:var(--line);position:relative;overflow:hidden}
.rail i b{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.jump{position:absolute;right:max(16px,4vw);bottom:18px;pointer-events:auto}
@media (max-width:760px){
  .hint{display:none}
  .stage{bottom:12px}
  .jump{display:none}
  .hero-copy .in{gap:.8rem}
}

/* sections */
section.s{padding-block:clamp(56px,9vw,112px)}
.s-head{display:flex;justify-content:space-between;align-items:end;gap:1.5rem;flex-wrap:wrap;margin-bottom:2.2rem}
.s-head h2{font-size:clamp(2.2rem,5vw,3.8rem);max-width:18ch}
:lang(si) .s-head h2{font-size:clamp(1.6rem,3.4vw,2.5rem);max-width:26ch}
.s-head .kick{display:block;color:var(--accent-text);margin-bottom:.6rem}
.rule{border-top:1px solid var(--line)}
.page-head{padding-block:clamp(40px,7vw,84px) clamp(24px,4vw,40px);border-bottom:1px solid var(--line)}
.page-head h1{font-size:clamp(2.8rem,8vw,6rem)}
:lang(si) .page-head h1{font-size:clamp(2rem,5vw,3.6rem)}
.page-head p.lead{margin-top:1rem;max-width:58ch;color:var(--muted);font-size:1.05rem}
.crumbs{display:flex;gap:.5rem;flex-wrap:wrap;color:var(--muted);margin-bottom:1.1rem}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--accent-text)}

/* placeholder / image frame */
.ph{position:relative;background:var(--surface);overflow:hidden;aspect-ratio:4/3;border-bottom:1px solid var(--line)}
.ph svg.draw{position:absolute;inset:0;width:100%;height:100%;color:var(--line-strong)}
.ph::after{content:attr(data-label);position:absolute;left:10px;bottom:8px;font:500 11px/1 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface);z-index:1}
.ph:has(img)::after{display:none}
.ph.wide{aspect-ratio:16/10}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:1.4rem}
.card{display:flex;flex-direction:column;background:var(--raise);border:1px solid var(--line-strong);text-decoration:none;min-width:0;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--fg)}
.card:hover .ph img{transform:scale(1.04)}
.card .ph img{transition:transform .5s}
.card .info{padding:1rem 1.1rem 1.2rem;display:grid;gap:.7rem}
.card h3{font-size:1.9rem}
.card .desc{font-size:13.5px;color:var(--muted)}
.tb{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.tb div{padding:.45rem .6rem;border-right:1px solid var(--line)}
.tb div:last-child{border-right:0}
.tb dt{font:500 10px/1.2 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:lang(si) .tb dt{letter-spacing:0;font-size:11px}
.tb dd{font:700 1.25rem/1.2 var(--font-d)}
.badge{display:inline-block;padding:.15rem .5rem;border:1px solid var(--line-strong);font:500 11px/1.4 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.more{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;font-size:14px;color:var(--accent-text)}
.more svg{width:15px;height:15px}

/* filters */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.8rem}
.filters button{padding:.5rem 1rem;border:1.5px solid var(--line-strong);font-weight:600;font-size:13.5px;min-height:40px}
.filters button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* carousel */
.carousel{position:relative}
.track{display:flex;gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:1rem;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.track .card{flex:0 0 min(78vw,320px);scroll-snap-align:start}
.car-btns{display:flex;gap:.5rem}
.car-btns button{width:46px;height:46px;border:1.5px solid var(--fg);display:flex;align-items:center;justify-content:center}
.car-btns button:hover{background:var(--fg);color:var(--bg)}
.car-btns svg{width:18px;height:18px}
.value{font:700 1.5rem/1 var(--font-d);color:var(--accent-text)}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,72px);align-items:start}
.intro h2{font-size:clamp(2.2rem,5vw,4rem)}
:lang(si) .intro h2{font-size:clamp(1.6rem,3.4vw,2.5rem)}
.facts{display:grid;gap:0;border-top:1px solid var(--fg)}
.facts li{display:grid;grid-template-columns:auto 1fr;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line);align-items:start}
.facts li svg{width:22px;height:22px;color:var(--accent-text);margin-top:2px}
@media (max-width:820px){.intro{grid-template-columns:1fr}}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:0;border-top:1px solid var(--fg);border-left:1px solid var(--line)}
.svc article{padding:1.4rem 1.3rem 1.6rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:.6rem;align-content:start;min-width:0}
.svc svg{width:30px;height:30px;color:var(--accent-text)}
.svc h3{font-size:1.7rem}
.svc p{font-size:14px;color:var(--muted)}
.svc .num{color:var(--muted)}

/* night band */
.night{background:var(--night);color:var(--on-night)}
.night .muted{color:#A9B2B3}
.night .btn{border-color:var(--on-night)}
.night .btn:hover{background:var(--on-night);color:var(--night)}
.night .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.night .kick{color:#FF9552}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1.6rem 2rem}
.reasons article{border-top:2px solid var(--accent);padding-top:1rem;display:grid;gap:.5rem;align-content:start}
.reasons h3{font-size:1.8rem}
.reasons p{font-size:14.5px}

/* detail pages */
.detail{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);padding-block:clamp(28px,4vw,48px) clamp(48px,7vw,96px)}
@media (max-width:900px){.detail{grid-template-columns:minmax(0,1fr)}}
.gal-main{border:1px solid var(--line-strong);background:var(--raise)}
.gal-main .ph{border-bottom:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:.6rem;margin-top:.7rem}
.thumbs button{border:1.5px solid var(--line);padding:0;background:var(--raise);position:relative}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs .ph{aspect-ratio:4/3;border:0}
.thumbs .ph::after{display:none}
.cap{margin-top:.6rem;color:var(--muted)}
.sheet{border:1.5px solid var(--fg);background:var(--raise)}
.sheet .hd{padding:1.2rem 1.3rem;border-bottom:1.5px solid var(--fg);display:grid;gap:.5rem}
.sheet .hd h1{font-size:clamp(3rem,6vw,4.6rem)}
.sheet .blk{padding:1.1rem 1.3rem;border-bottom:1px solid var(--line)}
.sheet .blk:last-child{border-bottom:0}
.sheet h2{font:500 11px/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.8rem}
:lang(si) .sheet h2{letter-spacing:0;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips li{padding:.3rem .65rem;border:1px solid var(--line-strong);font-size:13.5px}
.fin{display:grid;gap:0}
.fin div{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:14px}
.fin div:last-child{border-bottom:0}
.fin dt{color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-block:1.4rem;border-top:1px solid var(--line)}
.pager a{display:grid;gap:.15rem;text-decoration:none;min-width:0}
.pager a.next{text-align:right;margin-left:auto}
.pager a:hover strong{color:var(--accent-text)}
.pager strong{font:700 1.8rem/1 var(--font-d);text-transform:uppercase}
.meta{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.meta div{padding:.7rem .9rem}
.meta div+div{border-left:1px solid var(--line)}
.meta dt{font:500 10px/1.2 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.meta dd{font:700 1.6rem/1.1 var(--font-d)}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:1rem;margin-top:1rem}
.pgal .ph{border:1px solid var(--line-strong)}

/* about / why */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:2rem 3rem}
.prose{display:grid;gap:1rem;max-width:62ch;font-size:1.02rem}
.prose.big{font-size:1.15rem}
.ticks{display:grid;gap:.7rem}
.ticks li{display:grid;grid-template-columns:22px 1fr;gap:.7rem}
.ticks svg{width:20px;height:20px;color:var(--accent-text);margin-top:3px}
.warn svg{color:var(--blue)}

/* estimator */
.est{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1.5px solid var(--fg);background:var(--raise)}
.est>div{padding:clamp(20px,3vw,36px);display:grid;gap:1.3rem;align-content:start;min-width:0}
.est .out{background:var(--night);color:var(--on-night)}
.est label{display:block;font:500 11px/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.est input[type=number],.field input,.field textarea,.field select{width:100%;padding:.7rem .85rem;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line-strong);border-radius:0}
.est input[type=number]{font:700 1.8rem/1.2 var(--font-d)}
.tiers{display:grid;gap:.5rem}
.tiers label{display:flex;align-items:center;gap:.7rem;margin:0;padding:.75rem .85rem;border:1.5px solid var(--line-strong);cursor:pointer;font:500 14px/1.3 var(--font-b);letter-spacing:0;text-transform:none;color:var(--fg)}
.tiers input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.tiers label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tiers span{display:grid;gap:.1rem}
.tiers small{color:var(--muted);font-size:12.5px}
.total{font:800 clamp(2.6rem,5vw,4rem)/1 var(--font-d);color:#FF9552;overflow-wrap:anywhere}
.est .out .muted{color:#A9B2B3}
@media (max-width:820px){.est{grid-template-columns:minmax(0,1fr)}}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,64px);padding-block:clamp(32px,5vw,64px) clamp(56px,8vw,100px)}
@media (max-width:900px){.contact{grid-template-columns:minmax(0,1fr)}}
.info-list{display:grid;gap:0;border-top:1px solid var(--fg)}
.info-list li{padding:1rem 0;border-bottom:1px solid var(--line);display:grid;gap:.2rem}
.info-list a{text-decoration:none;font-weight:500}
.form{border:1.5px solid var(--fg);background:var(--raise);padding:clamp(18px,3vw,32px);display:grid;gap:1rem}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:560px){.form .two{grid-template-columns:1fr}}
.field label{display:block;font:500 11px/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.msgbox{border:1.5px dashed var(--accent);padding:1rem;display:grid;gap:.8rem;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.msgbox pre{white-space:pre-wrap;font:13px/1.55 var(--font-m);margin:0;overflow-wrap:anywhere}

/* footer */
footer{background:var(--night);color:var(--on-night);margin-top:0}
footer .wrap{padding-block:clamp(40px,6vw,72px) 28px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:2rem 3rem}
@media (max-width:820px){.fgrid{grid-template-columns:1fr}}
footer h4{font:500 11px/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:#A9B2B3;margin-bottom:1rem}
footer a{text-decoration:none;display:block;padding:.25rem 0}
footer a:hover{color:#FF9552}
.fbase{margin-top:2.4rem;padding-top:1.2rem;border-top:1px solid #2A3235;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:13px;color:#A9B2B3}
footer .logo{color:var(--on-night);margin-bottom:1rem}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* Chat widget */
.chat-ok{margin:0 0 .5rem;font-size:13px;font-weight:700;color:#1b8f45}
#chat{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:90;font-family:var(--font-b)}
.chat-fab{display:flex;align-items:center;gap:.6rem;height:56px;padding:0 1.1rem 0 .95rem;border:0;border-radius:999px;background:#1FAF54;color:#fff;font:600 15px/1 var(--font-b);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28);position:relative}
.chat-fab svg{width:26px;height:26px;flex:none}
.chat-fab:focus-visible,.chat-x:focus-visible,.chat-chip:focus-visible,.chat-in button:focus-visible,.chat-in a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chat-fab::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid #1FAF54;animation:chatpulse 2.6s ease-out infinite;pointer-events:none}
@keyframes chatpulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.chat-fab::after{animation:none;opacity:0}}
@media (max-width:560px){.chat-fab span{display:none}.chat-fab{width:56px;padding:0;justify-content:center}}
.chat-panel{position:absolute;right:0;bottom:70px;width:min(380px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 110px));display:flex;flex-direction:column;background:var(--raise);color:var(--fg);border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.chat-hd{display:flex;align-items:center;gap:.7rem;padding:.8rem .9rem;background:#128C4A;color:#fff}
.chat-hd .av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.chat-hd .av i{display:block;width:30px;height:15px;background:var(--logo-l) center/contain no-repeat}
.chat-hd strong{display:block;font-size:15px;line-height:1.3}.chat-hd small{display:block;font-size:12px;opacity:.9}
.chat-x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:.2rem .5rem;border-radius:8px}
.chat-log{padding:.9rem;display:flex;flex-direction:column;gap:.55rem;overflow-y:auto;flex:1;min-height:150px;background:color-mix(in srgb,var(--bg) 70%,var(--raise))}
.chat-m{max-width:86%;padding:.55rem .8rem;border-radius:14px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.chat-m.b{background:var(--raise);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.chat-m.u{background:#D8F6DF;color:#10281A;border-top-right-radius:4px;align-self:flex-end}
.chat-in{padding:.7rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.5rem;background:var(--raise)}
.chat-chip{border:1.5px solid var(--line-strong);background:transparent;color:var(--fg);border-radius:999px;padding:.5rem .85rem;font:500 14px/1.3 var(--font-b);cursor:pointer}
.chat-chip:hover{border-color:var(--accent);color:var(--accent-text)}
.chat-in form{display:flex;gap:.5rem;width:100%}
.chat-in input{flex:1;min-width:0;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:10px;padding:.6rem .75rem;font:16px var(--font-b)}
.chat-in button.go,.chat-in a.go{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:10px;background:#1FAF54;color:#fff;padding:.6rem .95rem;font:600 14.5px var(--font-b);cursor:pointer;text-decoration:none}
.chat-in a.alt,.chat-in button.alt{display:inline-flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:10px;background:transparent;color:var(--fg);padding:.55rem .85rem;font:500 14px var(--font-b);cursor:pointer;text-decoration:none}
.chat-in .full{width:100%;justify-content:center}.chat-in svg,.chat-fab svg{width:22px;height:22px;flex:none}.chat-fab svg{width:26px;height:26px}
.sendrow{display:flex;gap:.6rem;flex-wrap:wrap}
@media (max-width:560px){#chat{right:12px;bottom:12px}.chat-panel{position:fixed;right:12px;left:12px;bottom:80px;width:auto}}

/* Sinhala rendering: no letter-spacing (breaks conjunct shaping), no forced caps, roomy line-height, readable sizes */
:lang(si){--sif:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI","Sinhala Sangam MN","Noto Serif Sinhala",system-ui,sans-serif}

/* Auto-deliver inquiries to the team inbox (FormSubmit). Falls back silently to the WhatsApp / email buttons. */
function deliver(subject,text,cb){
  var done=false; function fin(ok){ if(done) return; done=true; try{cb(!!ok)}catch(x){} }
  try{
    var ctl=window.AbortController?new AbortController():null; setTimeout(function(){ if(ctl) ctl.abort(); fin(false); },9000);
    fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},signal:ctl?ctl.signal:undefined,
      body:JSON.stringify({_subject:subject,_template:'box',_captcha:'false',message:text})})
      .then(function(r){return r.json()}).then(function(j){ fin(j&&(j.success===true||j.success==='true')); }).catch(function(){ fin(false); });
  }catch(e){ fin(false); }
}

function chAdvance(val){

  return true;

/* line drawing used as the placeholder behind every photo */
function draw(kind){
  var s='';
  if(kind==='two'){
    s='<path d="M20 215H380"/><rect x="70" y="150" width="260" height="65"/><rect x="110" y="85" width="200" height="65"/><path d="M96 80h228v8H96z"/><rect x="128" y="104" width="164" height="26"/><path d="M128 117h164M169 104v26M210 104v26M251 104v26"/><rect x="170" y="165" width="130" height="50"/><path d="M213 165v50M256 165v50"/><rect x="84" y="165" width="44" height="50" stroke-dasharray="4 4"/><path d="M96 215v-50M108 215v-50M120 215v-50" stroke-dasharray="2 4"/><rect x="258" y="143" width="40" height="7" fill="#E86A17" stroke="none"/>';
  }else if(kind==='single'){
    s='<path d="M20 215H380"/><rect x="70" y="130" width="260" height="85"/><path d="M58 122h284v8H58z"/><rect x="92" y="152" width="60" height="34"/><path d="M122 152v34M92 169h60"/><rect x="176" y="152" width="60" height="63"/><rect x="258" y="152" width="50" height="34"/><path d="M283 152v34"/><rect x="176" y="152" width="14" height="10" fill="#E86A17" stroke="none"/>';
  }else if(kind==='plan'){
    s='<rect x="70" y="40" width="260" height="180"/><path d="M70 120h120M190 40v180M190 150h140M250 40v50M70 170h60"/><path d="M130 120v50" stroke-dasharray="3 3"/><path d="M310 150a22 22 0 0 0-22-22" stroke-dasharray="2 3"/>';
  }else{
    s='<path d="M20 225H380"/><rect x="90" y="140" width="110" height="85"/><path d="M80 140l65-40 65 40"/><rect x="230" y="190" width="70" height="35"/><path d="M160 225v-40h26v40M40 225v-30M52 225v-30M300 160l30-30 30 30M330 130v95"/>';
  }
  return '<svg class="draw" viewBox="0 0 400 260" fill="none" stroke="currentColor" stroke-width="2" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+s+'</svg>';
}
function ph(rel,label,kind,cls){
  var url=rel?(rel.indexOf('http')===0?rel:BASE+'housemodel/'+rel):'';
  return '<div class="ph '+(cls||'')+'" data-label="'+label+'">'+draw(kind)+(url?'<img src="'+enc(url)+'" alt="'+label+'" loading="lazy" decoding="async">':'')+'</div>';
}
function phProj(rel,label,cls){return '<div class="ph '+(cls||'')+'" data-label="'+label+'">'+draw('site')+'<img src="'+enc(BASE+rel)+'" alt="'+label+'" loading="lazy" decoding="async"></div>'}
document.addEventListener('error',function(e){var el=e.target;if(el&&el.tagName==='IMG'&&el.closest('.ph')){el.remove();}},true);

function modelCard(m){
  return '<a class="card" href="'+routePath('model-'+m.id)+'" data-go="model-'+m.id+'">'+
   ph(m.imgs[0][0],m.code,m.st===2?'two':'single')+
   '<div class="info"><div class="row"><h3 class="display">'+m.code+'</h3><span class="badge">'+stType(m)+'</span></div>'+
   '<dl class="tb"><div><dt>'+t('Bedrooms','නිදන කාමර')+'</dt><dd>'+m.beds+'</dd></div><div><dt>'+t('Baths','නාන කාමර')+'</dt><dd>'+m.baths+'</dd></div><div><dt>'+t('Storeys','මහල්')+'</dt><dd>'+m.st+'</dd></div></dl>'+
   '<p class="desc">'+modelDesc(m)+'</p>'+
   '<span class="more">'+t('View model','විස්තර බලන්න')+IC.arrow+'</span></div></a>';
}
function projCard(p){
  return '<a class="card" href="'+routePath('project-'+p.id)+'" data-go="project-'+p.id+'">'+
   phProj(p.imgs[0],L(p.name),'')+
   '<div class="info"><div class="row"><h3 class="display">'+L(p.name)+'</h3><span class="badge">'+t('Handed over','භාර දෙන ලදී')+'</span></div>'+
   '<p class="desc">'+L(p.loc)+(p.note?' · '+L(p.note):'')+'</p>'+

function head(kick,title,lead,crumbs){
  return '<div class="page-head"><div class="wrap">'+(crumbs||'')+'<span class="mono accent-text">'+kick+'</span><h1 class="display" style="margin-top:.7rem">'+title+'</h1>'+(lead?'<p class="lead">'+lead+'</p>':'')+'</div></div>';
}
function crumbs(arr){
  return '<div class="crumbs mono">'+arr.map(function(c,i){return c[1]?'<a href="'+routePath(c[1])+'" data-go="'+c[1]+'">'+c[0]+'</a><span>/</span>':'<span>'+c[0]+'</span>'}).join('')+'</div>';

  '<section class="s"><div class="wrap intro"><div><span class="mono accent-text">'+t('Architectural design','වාස්තු විද්‍යාත්මක සැලසුම්')+'</span><h2 class="display" style="margin-top:.8rem">'+t('A house plan shaped around your needs','ඔබේ අවශ්‍යතා අනුව නිර්මාණය කළ නිවාස සැලැස්මක්')+'</h2><div class="prose" style="margin-top:1.4rem"><p>'+t('Our architectural design service focuses on homes that suit your plot, budget and family. We also prepare detailed bills of quantities so you can understand the estimated cost before construction begins.','ඔබේ ඉඩමට, අයවැයට සහ පවුලට ගැළපෙන නිවාස සැලසුම් කිරීම අපගේ වාස්තු විද්‍යාත්මක සේවාවේ අරමුණයි. ඉදිකිරීම් ආරම්භයට පෙර ඇස්තමේන්තුගත පිරිවැය අවබෝධ කරගැනීමට සවිස්තරාත්මක B.O.Q. වාර්තාද සකස් කරමු.')+'</p></div><p style="margin-top:1.6rem"><a class="btn primary" href="'+routePath('models')+'" data-go="models">'+t('Explore house designs','නිවාස සැලසුම් බලන්න')+IC.arrow+'</a></p></div><ul class="facts"><li>'+IC.pen+'<div><strong>'+t('Architectural design','වාස්තු විද්‍යාත්මක සැලසුම්')+'</strong><p class="muted" style="font-size:14px">'+t('Homes designed to suit your plot, budget and family.','ඔබේ ඉඩමට, අයවැයට සහ පවුලට ගැළපෙන නිවාස සැලසුම්.')+'</p></div></li><li>'+IC.sheet+'<div><strong>'+t('B.O.Q. preparation','B.O.Q. සකස් කිරීම')+'</strong><p class="muted" style="font-size:14px">'+t('A detailed bill of quantities so you know the cost before work starts.','වැඩ ආරම්භයට පෙර පිරිවැය දැනගැනීමට සවිස්තරාත්මක B.O.Q. වාර්තාවක්.')+'</p></div></li><li>'+IC.plan+'<div><strong>'+t('Project planning','ව්‍යාපෘති සැලසුම්කරණය')+'</strong><p class="muted" style="font-size:14px">'+t('Schedules, costs and B.O.Q. prepared before work begins.','වැඩ ආරම්භයට පෙර කාලසටහන්, පිරිවැය සහ B.O.Q. සකස් කිරීම.')+'</p></div></li><li>'+IC.chat+'<div><strong>'+t('Consulting','උපදේශන')+'</strong><p class="muted" style="font-size:14px">'+t('Guidance on budget, materials and methods before you start building.','ඉදිකිරීම් ආරම්භයට පෙර අයවැය, ද්‍රව්‍ය සහ ක්‍රමවේද පිළිබඳ උපදෙස්.')+'</p></div></li></ul></div></section>'+ctaBand();
};

PAGES.services=function(){
  var cards=SERVICES.map(function(s,i){return '<article>'+IC[s.ic]+'<span class="mono num">'+('0'+(i+1)).slice(-2)+'</span><h3 class="display">'+L(s.n)+'</h3><p>'+L(s.d)+'</p></article>'}).join('');
  var key=KEY4.map(function(k){return '<article>'+IC[k.ic]+'<h3 class="display">'+L(k.n)+'</h3><p>'+L(k.d)+'</p></article>'}).join('');
  return head(t('Our services','අපගේ සේවා'),t('Everything a home needs, under one roof','නිවසකට අවශ්‍ය සියල්ල එකම ආයතනයකින්'),t('From the first sketch to the last tile.','පළමු සැලසුමේ සිට අවසාන ටයිල් කැබැල්ල දක්වා.'),crumbs([[t('Home','මුල් පිටුව'),'home'],[t('Services','සේවා')]]))+
  '<section class="s"><div class="wrap"><div class="s-head"><div><span class="mono kick accent-text">'+t('Core service','ප්‍රධාන සේවා')+'</span><h2 class="display">'+t('How a build runs with us','අප සමඟ ඉදිකිරීමක් සිදුවන ආකාරය')+'</h2></div></div><div class="svc">'+key+'</div></div></section>'+
  '<section class="s rule" style="background:var(--surface)"><div class="wrap"><div class="s-head"><div><span class="mono kick accent-text">'+t('All services','සියලු සේවා')+'</span><h2 class="display">'+t('What we can do for you','අපට ඔබට කළ හැක්කේ')+'</h2></div></div><div class="svc">'+cards+'</div></div></section>'+ctaBand();
};

PAGES.models=function(){
  return head(t('House models','ආදර්ශ නිවාස'),t('Sinha model house catalogue','සිංහ ආදර්ශ නිවාස සමුච්චය'),t('Eight ready designs, two storey and single storey. Every plan can be adjusted to suit your land.','ද්විමහල් සහ තනි මහල් ආදර්ශ නිවාස සැලසුම් අටක්. ඕනෑම සැලසුමක් ඔබේ ඉඩමට ගැළපෙන සේ වෙනස් කළ හැක.'),crumbs([[t('Home','මුල් පිටුව'),'home'],[t('House models','ආදර්ශ නිවාස')]]))+
  '<section class="s" style="padding-top:2rem"><div class="wrap"><div class="filters" role="group" aria-label="Filter">'+
   '<button type="button" data-filter="0" aria-pressed="true">'+t('All models','සියල්ල')+'</button>'+
   '<button type="button" data-filter="2" aria-pressed="false">'+t('Two storey','දෙමහල්')+'</button>'+
   '<button type="button" data-filter="1" aria-pressed="false">'+t('Single storey','තනි මහල්')+'</button></div>'+
   '<div class="cards" id="mgrid">'+MODELS.map(function(m){return modelCard(m).replace('<a class="card"','<a data-st="'+m.st+'" class="card"')}).join('')+'</div>'+
   '<div class="sheet" style="margin-top:3rem"><div class="hd" style="grid-template-columns:1fr auto;align-items:center;gap:1rem"><div><h2 class="display" style="font-size:2.2rem;margin:0;color:var(--fg);font-family:var(--font-d)">'+t('Need a modification?','වෙනස්කමක් අවශ්‍යද?')+'</h2><p class="muted" style="font-size:14px">'+t('Tell us your land shape, slope or special requirements and we will adjust the plan.','ඔබේ ඉඩමේ හැඩය, බෑවුම හෝ විශේෂ අවශ්‍යතා කියන්න, අපි සැලසුම වෙනස් කරමු.')+'</p></div><a class="btn primary" href="'+routePath('contact')+'" data-go="contact">'+t('Request a custom plan','අභිරුචි සැලසුමක් ඉල්ලන්න')+IC.arrow+'</a></div></div></div></section>';
};

PAGES.model=function(id){
  var m=modelById(id), i=MODELS.indexOf(m), prev=MODELS[(i+MODELS.length-1)%MODELS.length], next=MODELS[(i+1)%MODELS.length];
  var kind=m.st===2?'two':'single';
  var labels={v:t('Elevation view','පෙනුම'),gf:t('Ground floor plan','පහළ මහලේ සැලැස්ම'),uf:t('First floor plan','පළමු මහලේ සැලැස්ම')};
  var main=m.imgs[0];
  var thumbs=m.imgs.map(function(im,k){return '<button type="button" data-thumb="'+k+'" aria-pressed="'+(k===0)+'" aria-label="'+labels[im[1]]+' '+(k+1)+'">'+ph(im[0],'',im[1]==='v'?kind:'plan')+'</button>'}).join('');
  var chips=m.rooms.map(function(r){return '<li>'+roomLabel(r)+'</li>'}).join('');
  var fin=['floor','wall','roof','ceil'].map(function(k){return '<div><dt>'+L(F[k].l)+'</dt><dd>'+L(F[k].v)+'</dd></div>'}).join('')+
    '<div><dt>'+L(F.pantryL)+'</dt><dd>'+L(m.pantry==='full'?F.pantryFull:F.pantrySmall)+'</dd></div>'+
    ['door','bath'].map(function(k){return '<div><dt>'+L(F[k].l)+'</dt><dd>'+L(F[k].v)+'</dd></div>'}).join('');
  var others=MODELS.filter(function(x){return x!==m&&x.st===m.st}).slice(0,3);
  var msg='Hello Sinha Homes, I am interested in the '+m.code+' model house. Please send the plans and a B.O.Q. estimate.';
  return '<div class="wrap" style="padding-top:clamp(24px,4vw,44px)">'+crumbs([[t('Home','මුල් පිටුව'),'home'],[t('House models','ආදර්ශ නිවාස'),'models'],[m.code]])+'</div>'+
  '<div class="wrap detail" style="padding-top:0"><div><div class="gal-main" id="galMain" data-model="'+m.id+'">'+ph(main[0],m.code+' · '+labels[main[1]],kind,'wide')+'</div><p class="cap mono" id="galCap">'+labels[main[1]]+' 1 / '+m.imgs.length+'</p><div class="thumbs">'+thumbs+'</div></div>'+
  '<aside class="sheet"><div class="hd"><span class="badge" style="justify-self:start">'+stType(m)+'</span><h1 class="display">'+m.code+'</h1><p class="muted" style="font-size:14px">'+modelDesc(m)+'</p></div>'+
  '<div class="blk"><dl class="tb"><div><dt>'+t('Bedrooms','නිදන කාමර')+'</dt><dd>'+m.beds+'</dd></div><div><dt>'+t('Baths','නාන කාමර')+'</dt><dd>'+m.baths+'</dd></div><div><dt>'+t('Storeys','මහල්')+'</dt><dd>'+m.st+'</dd></div></dl></div>'+
  '<div class="blk"><h2>'+t('Specification','පිරිවිතර')+'</h2><ul class="chips">'+chips+'</ul></div>'+
  '<div class="blk"><h2>'+t('Standard finishes','සම්මත නිමාවන්')+'</h2><dl class="fin">'+fin+'</dl></div>'+
  '<div class="blk" style="display:grid;gap:.7rem"><a class="btn primary" href="'+waUrl(msg)+'" target="_blank" rel="noopener">'+IC.wa+t('Ask for plans & B.O.Q.','සැලසුම් සහ B.O.Q. ඉල්ලන්න')+'</a><a class="btn" href="'+routePath('contact')+'" data-go="contact">'+t('Request a custom plan','අභිරුචි සැලසුමක් ඉල්ලන්න')+'</a><p class="muted" style="font-size:13px">'+t('Phone','දුරකථන')+': '+PHONE1+' · '+PHONE2+'</p></div></aside></div>'+
  '<div class="wrap"><div class="pager"><a href="'+routePath('model-'+prev.id)+'" data-go="model-'+prev.id+'"><span class="mono muted">← '+t('Previous','පෙර')+'</span><strong>'+prev.code+'</strong></a><a class="next" href="'+routePath('model-'+next.id)+'" data-go="model-'+next.id+'"><span class="mono muted">'+t('Next','ඊළඟ')+' →</span><strong>'+next.code+'</strong></a></div></div>'+
  '<section class="s rule" style="background:var(--surface)"><div class="wrap"><div class="s-head"><div><span class="mono kick accent-text">'+t('More like this','මෙවැනි තවත් නිවාස')+'</span><h2 class="display">'+(m.st===2?t('Other two storey models','වෙනත් දෙමහල් මාදිලි'):t('Other single storey models','වෙනත් තනි මහල් මාදිලි'))+'</h2></div></div><div class="cards">'+others.map(modelCard).join('')+'</div></div></section>';
};

PAGES.projects=function(){
  return head(t('Completed projects','නිමකළ ව්‍යාපෘති'),t('Homes we have built across Sri Lanka','ශ්‍රී ලංකාව පුරා අප ඉදිකළ නිවාස'),t('Nine completed and handed-over projects, each with its location and photos.','නිම කර භාර දුන් ව්‍යාපෘති නවයක්, ස්ථානය සහ ඡායාරූප සමඟ.'),crumbs([[t('Home','මුල් පිටුව'),'home'],[t('Projects','ව්‍යාපෘති')]]))+
  '<section class="s" style="padding-top:2.4rem"><div class="wrap"><div class="cards">'+PROJECTS.map(projCard).join('')+'</div></div></section>'+ctaBand();
};

PAGES.project=function(id){
  var p=projById(id), i=PROJECTS.indexOf(p), prev=PROJECTS[(i+PROJECTS.length-1)%PROJECTS.length], next=PROJECTS[(i+1)%PROJECTS.length];
  var gal=p.imgs.slice(1).map(function(im,k){return phProj(im,L(p.name)+' · '+(k+2))}).join('');
  var others=PROJECTS.filter(function(x){return x!==p}).slice(i%6,(i%6)+3);
  if(others.length<3) others=PROJECTS.filter(function(x){return x!==p}).slice(0,3);
  var msg='Hello Sinha Homes, I saw your '+p.name.en+' project and would like to talk about building a home.';
  return '<div class="wrap" style="padding-top:clamp(24px,4vw,44px)">'+crumbs([[t('Home','මුල් පිටුව'),'home'],[t('Projects','ව්‍යාපෘති'),'projects'],[L(p.name)]])+'</div>'+
  '<div class="wrap detail" style="padding-top:0"><div><div class="gal-main">'+phProj(p.imgs[0],L(p.name),'wide')+'</div>'+(gal?'<div class="pgal">'+gal+'</div>':'')+'</div>'+
  '<aside class="sheet"><div class="hd"><span class="badge" style="justify-self:start">'+t('Completed','නිමකළ')+'</span><h1 class="display">'+L(p.name)+'</h1>'+(p.note?'<p class="muted" style="font-size:14px">'+L(p.note)+'</p>':'')+'</div>'+

    g.userData={a:.88,b:.98,mode:'pop',y0:0,h:0,s:s}; g.scale.setScalar(.001); scene0.add(g); parts.push(g);
  }
  function pot(x,z){
    var g=new THREE.Group(); g.position.set(x,0,z);
    var p=new THREE.Mesh(new THREE.CylinderGeometry(.17,.13,.32,10),mat.pot); p.position.y=.16; p.castShadow=true; g.add(p);
    var l=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),mat.bush); l.position.y=.42; g.add(l);
    var f=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),mat.bloom); f.position.set(.05,.6,.02); g.add(f);
    g.userData={a:.90,b:.98,mode:'pop',y0:0,h:0,s:1}; g.scale.setScalar(.001); scene0.add(g); parts.push(g);
  }
  tree(-11,-9,1,mat.leaf); tree(11,-9.5,1.1,mat.leaf2); tree(-11.4,5.5,.9,mat.leaf2); tree(4.6,-9.6,.9,mat.leaf); tree(-4.5,-9.6,1,mat.leaf2); tree(8.8,9.4,.85,mat.leaf);
  palm(11.4,8.6,1); palm(-11.6,-3,.95); palm(11.6,-5,1);
  bush(-6.6,5.6,1); bush(-.2,5.6,1); bush(.4,8.4,1.1); bush(7.6,5.2,1);
  [1.0,1.8,4.9,5.7,6.5].forEach(function(x){ cone(x,3.4,1); });
  [-2.3,-1.4,-.5,.4].forEach(function(z){ pot(-5.15,z); });
  pot(-4.5,3.6); pot(-5.8,3.4);

  /* scaffold around the main block */
  var scaf=new THREE.Group(); scene0.add(scaf);
  [-5.4,-2.4,.6,3.6,6.4].forEach(function(x){ box(.09,8.6,.09,mat.steel,x,0,4.0,scaf); box(.09,8.6,.09,mat.steel,x,0,-4.2,scaf); });
  box(.09,8.6,.09,mat.steel,-5.4,0,-.1,scaf); box(.09,8.6,.09,mat.steel,6.4,0,-.1,scaf);
  [1.5,3.9,6.3].forEach(function(y){
    box(11.8,.07,.07,mat.steel,.5,y,4.0,scaf); box(11.8,.07,.07,mat.steel,.5,y,-4.2,scaf);
    box(.07,.07,8.2,mat.steel,-5.4,y,-.1,scaf); box(.07,.07,8.2,mat.steel,6.4,y,-.1,scaf);
  });
  box(11.8,.06,.8,M(0x9b7a4a),.5,3.9,4.4,scaf); box(11.8,.06,.8,M(0x9b7a4a),.5,1.5,4.4,scaf);

  /* crane */
  var crane=new THREE.Group(); crane.position.set(-11,0,-8); scene0.add(crane);
  box(2.4,.8,2.4,mat.conc,0,0,0,crane);
  [[-.3,-.3],[.3,-.3],[-.3,.3],[.3,.3]].forEach(function(c){ box(.1,13,.1,mat.orange,c[0],.8,c[1],crane); });
  for(var ri=0;ri<13;ri++){ box(.7,.05,.05,mat.orange,0,1+ri,.3,crane); box(.7,.05,.05,mat.orange,0,1+ri,-.3,crane); box(.05,.05,.7,mat.orange,.3,1+ri,0,crane); box(.05,.05,.7,mat.orange,-.3,1+ri,0,crane); }
  var slew=new THREE.Group(); slew.position.y=13.8; crane.add(slew);
  box(15,.35,.5,mat.orange,4.5-7.5,0,0,slew).position.x=4.5; /* jib */
  box(15,.1,.1,mat.orange,4.5,-.5,0,slew); box(1.4,1.2,1.4,mat.conc,-2.4,-1.3,0,slew); box(1,1,1,mat.dark,.3,-1,.75,slew); box(.9,1.5,.9,mat.orange,0,0,0,slew);
  var trolley=new THREE.Group(); slew.add(trolley);
  var cable=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1,6),mat.dark); trolley.add(cable);
  var load=box(1.1,.6,1.1,mat.brick,0,0,0,trolley);

  /* workers */
  var workers=[];
  function makeWorker(i){
    var g=new THREE.Group();
    var skin=M([0xe0b48c,0xc68c5f,0x9a6a45,0x7a4f32][i%4]);
    var shirt=M([0x2f5d8a,0x3b7a57,0x8a3b3b,0x555b66,0x7a6a2f][i%5]);
    var helm=M(i===9?0xffffff:[0xf2c21a,0xE86A17,0xf2c21a,0xffffff][i%4],{roughness:.5});
    var pants=M(0x2b3039);
    var torso=new THREE.Mesh(new THREE.BoxGeometry(.34,.5,.22),shirt); torso.position.y=.72; torso.castShadow=true; g.add(torso);
    var vest=new THREE.Mesh(new THREE.BoxGeometry(.36,.28,.24),M(0xff7a1a,{emissive:0x5a2100,emissiveIntensity:.5})); vest.position.y=.76; g.add(vest);
    var head=new THREE.Mesh(new THREE.SphereGeometry(.14,12,10),skin); head.position.y=1.1; g.add(head);
    var hat=new THREE.Mesh(new THREE.SphereGeometry(.165,12,8,0,Math.PI*2,0,Math.PI/2),helm); hat.position.y=1.12; hat.castShadow=true; g.add(hat);
    var brim=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.02,12),helm); brim.position.set(0,1.12,.02); g.add(brim);
    function limb(w,h,mm,px,py){ var p=new THREE.Group(); p.position.set(px,py,0); var b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mm); b.position.y=-h/2; b.castShadow=true; p.add(b); g.add(p); return p; }
    var legL=limb(.13,.46,pants,-.09,.47), legR=limb(.13,.46,pants,.09,.47);
    var armL=limb(.1,.4,shirt,-.23,.93), armR=limb(.1,.4,shirt,.23,.93);
    var tool=new THREE.Mesh(new THREE.BoxGeometry(.04,.26,.04),mat.dark); tool.position.set(0,-.42,.08); armR.add(tool);
    var thead=new THREE.Mesh(new THREE.BoxGeometry(.14,.06,.06),mat.steel); thead.position.set(0,-.54,.08); armR.add(thead);
    var blk=new THREE.Mesh(new THREE.BoxGeometry(.3,.16,.2),mat.brick); blk.position.set(0,.7,.22); blk.visible=false; g.add(blk);
    g.scale.setScalar(1.15); g.userData={legL:legL,legR:legR,armL:armL,armR:armR,blk:blk,ph:i*1.7}; scene0.add(g); workers.push(g); return g;
  }
  for(var wi=0;wi<10;wi++) makeWorker(wi);

  function tri(u){ return u<.5?u*2:2-u*2 }
  function placeWorker(i,t,p){
    var w=workers[i], U=w.userData, ph=U.ph, x=0,y=0,z=0, hx=0,hz=1, walking=false, working=false, carry=false;
    if(i<4){
      var u=((t*.09+i*.27)%1);
      var Px=9.5,Pz=-6.5, a=p*Math.PI*2*2.6+i*1.6, Sx=Math.cos(a)*7.4, Sz=Math.sin(a)*5.8;
      var k=clamp(tri(u)*1.35-.17,0,1);
      x=lerp(Px,Sx,k); z=lerp(Pz,Sz,k);
      var fw=u<.5; hx=fw?(Sx-Px):(Px-Sx); hz=fw?(Sz-Pz):(Pz-Sz);
      walking=k>.02&&k<.98; working=!walking&&k>=.98; carry=fw&&walking;
    }else if(i<9){
      var elev=(i<7);
      var yy=0, w2=0;
      if(elev){
        yy=3.9*ease(seg(p,.46,.54)); yy+=2.4*ease(seg(p,.76,.82)); yy*=1-ease(seg(p,.86,.92));
        w2=clamp(yy/3.9,0,1);
      }
      var cx=lerp(0,.5,w2), cz=lerp(.5,-.1,w2), rx=lerp(7.0,5.9,w2), rz=lerp(5.6,4.1,w2);
      var stat=(i%2===0), th;
      if(stat){ th=ph+p*Math.PI*2*1.5; working=true; }
      else { th=ph+t*.2*(i%4<2?1:-1); walking=true; }
      x=cx+Math.cos(th)*rx; z=cz+Math.sin(th)*rz; y=yy;
      x=clamp(x,-12,12);
      if(stat){ hx=cx-x; hz=cz-z; } else { hx=-Math.sin(th)*(i%4<2?1:-1); hz=Math.cos(th)*(i%4<2?1:-1); }
    }else{
      x=-6+Math.sin(t*.22)*2.4; z=8.2+Math.cos(t*.17)*.9; hx=Math.cos(t*.22); hz=-Math.sin(t*.17)*.4+.3; walking=true;
    }
    var hw=ease(seg(p,.93,.985));
    if(hw>0){
      var sx=(i-4.5)*1.25, sz=8.4+Math.abs(i-4.5)*.12;
      x=lerp(x,sx,hw); z=lerp(z,sz,hw); y=lerp(y,0,hw);
      hx=lerp(hx,cam.position.x-x,hw); hz=lerp(hz,cam.position.z-z,hw);
      if(hw>.95){walking=false;working=false;}
    }
    w.position.set(x,y,z);
    var len=Math.hypot(hx,hz)||1; w.rotation.y=Math.atan2(hx/len,hz/len);
    var sw=t*7+ph, bob=0;
    if(walking){ U.legL.rotation.x=Math.sin(sw)*.7; U.legR.rotation.x=-Math.sin(sw)*.7; U.armL.rotation.x=-Math.sin(sw)*.6; U.armR.rotation.x=Math.sin(sw)*.6; bob=Math.abs(Math.sin(sw))*.05; }
    else if(working){ U.legL.rotation.x=0; U.legR.rotation.x=0; U.armL.rotation.x=-.3; U.armR.rotation.x=-1.4+Math.sin(t*7+ph)*.8; }
    else { U.legL.rotation.x=0; U.legR.rotation.x=0; U.armL.rotation.x=0; U.armR.rotation.x=0; }
    if(hw>.95){ U.armR.rotation.x=-2.7+Math.sin(t*5+i)*.35; U.armL.rotation.x=-.2; }
    if(carry){ U.armL.rotation.x=-1.2; U.armR.rotation.x=-1.2; }
    U.blk.visible=carry&&hw<.5;
    w.position.y+=bob;
  }

  /* theme */
  var dark=false;
  function applyTheme(){ dark=false; }
  var earth=new THREE.Color(), lawn=new THREE.Color();
  function plotColor(p){
    earth.set(0x9c7f5e).convertSRGBToLinear(); lawn.set(0x7fa354).convertSRGBToLinear();
    plotMat.color.copy(earth).lerp(lawn,ease(seg(p,.78,.95)));
  }

  /* update */
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(p,t){
    for(var i=0;i<parts.length;i++){
      var m=parts[i], u=m.userData, e=ease(seg(p,u.a,u.b));
      if(u.mode==='grow'){ m.scale.y=Math.max(e,.0001); m.visible=e>.001; }
      else if(u.mode==='fade'){ m.material.opacity=e*u.op; m.visible=e>.01; }
      else if(u.mode==='drop'){ m.position.y=u.y0+(1-e)*u.h; m.visible=e>.001; }
      else if(u.mode==='pop'){ m.scale.setScalar(Math.max(e*(u.s||1),.001)); m.visible=e>.001; }
    }
    var pe=1-ease(seg(p,.12,.2)); pegs.forEach(function(pg){pg.scale.y=Math.max(pe,.0001);pg.visible=pe>.001});
    pile.scale.y=lerp(1,.35,ease(seg(p,.1,.8))); pile.visible=p<.9; pile.scale.x=pile.scale.z=1;
    var sv=ease(seg(p,.1,.24))*(1-ease(seg(p,.78,.88))); scaf.scale.y=Math.max(sv,.0001); scaf.visible=sv>.01;
    var cr=1-ease(seg(p,.86,.94)); crane.scale.setScalar(Math.max(cr,.001)); crane.visible=cr>.01;
    slew.rotation.y=-.63+Math.sin(t*.25)*.45+Math.sin(p*9)*.25;
    var tx=7+Math.sin(t*.3)*2.5, cl=4+3*(Math.sin(t*.4)+1)/2;
    trolley.position.x=tx; cable.scale.y=cl; cable.position.y=-cl/2; load.position.y=-cl-.6;
    intMat.emissiveIntensity=ease(seg(p,.9,1))*.55;
    plotColor(p);
    for(var w=0;w<workers.length;w++) placeWorker(w,t,p);
  }
  function placeCamera(p,t){
    var aspect=cam.aspect, idle=reduce?0:Math.sin(t*.15)*.04;
    var az=.9+Math.sin(p*Math.PI)*1.5-p*1.4+idle;
    var el=lerp(.6,.3,ease(p));
    var R=lerp(42,31,ease(p)); if(aspect<.8) R*=1.55; else if(aspect<1.25) R*=1.2;
    var ty=lerp(1,3.9,ease(p));
    cam.position.set(R*Math.sin(az)*Math.cos(el),ty+R*Math.sin(el),R*Math.cos(az)*Math.cos(el));
    cam.lookAt(-.3,ty,.6);
  }
  var cw=0,ch=0;
  function resize(){
    var w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return;
    cw=w; ch=h; renderer.setSize(w,h,false); cam.aspect=w/h;
    if(w/h>1.25) cam.setViewOffset(w,h,-w*.16,0,w,h); else cam.setViewOffset(w,h,0,h*.14,w,h);
    cam.updateProjectionMatrix();
  }
  var tgt=0, cur=0, tt=0, last=0, running=false, onFrame=null;
  function frame(now){
    if(!running) return;
    requestAnimationFrame(frame);
    var dt=Math.min((now-last)/1000,.1); last=now;
    tt+=dt; cur+=(tgt-cur)*(1-Math.exp(-dt*6));
    placeCamera(cur,tt); step(cur,tt); renderer.render(scene,cam);
    if(onFrame) onFrame(cur);
  }
  applyTheme();
  if(window.matchMedia){ try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme); }catch(e){} }
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('resize',resize);
  return {
    setTarget:function(p){tgt=p}, snap:function(p){tgt=p;cur=p},
    start:function(){ if(running) return; running=true; resize(); last=performance.now(); requestAnimationFrame(frame); },

    resize:resize, onFrame:function(f){onFrame=f}, renderOnce:function(){resize();placeCamera(cur,tt);step(cur,tt);renderer.render(scene,cam)}
  };
}

var engine=null, engineTried=false, heroVisible=true;
function heroProgress(){
  var h=$('#hero'), st=$('#sticky'); if(h.hidden) return 0;
  var rect=h.getBoundingClientRect(), top=parseFloat(getComputedStyle(st).top)||0;
  var total=h.offsetHeight-st.offsetHeight; if(total<=0) return 0;
  return Math.min(1,Math.max(0,(top-rect.top)/total));
}
function onScroll(){
  if(route!=='home') return;
  var p=heroProgress();
  if(engine) engine.setTarget(p); else paintHero(p);
}
function startHero(){
  if(!engineTried){
    engineTried=true; engine=createEngine($('#gl'));
    if(!engine){ $('#fb').style.display='block'; $('#fb').innerHTML=draw('two'); $('#gl').style.display='none'; }
    else { engine.onFrame(paintHero); }
  }
  var p=heroProgress(); paintHero(p);
  if(engine){ engine.snap(p); engine.start(); }
}
function stopHero(){ if(engine) engine.stop(); }
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){ if(route==='home') onScroll(); });
document.addEventListener('visibilitychange',function(){ if(!engine) return; if(document.hidden) engine.stop(); else if(route==='home'&&heroVisible) engine.start(); });
if('IntersectionObserver' in window){
  new IntersectionObserver(function(en){ heroVisible=en[0].isIntersecting; if(!engine||route!=='home') return; if(heroVisible) engine.start(); else engine.stop(); }).observe($('#hero'));
}

/* boot */
(function(){
  go(routeNameFromLocation(),true,true);
})();
